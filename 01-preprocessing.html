<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Data Pre-processing · IS328 Flashcards</title>
<style>
:root{
  --bg:#f4f1ea; --panel:#fffdf8; --ink:#1d1b16; --muted:#6b665b; --line:#e2dccf;
  --accent:#2f6f9f; --accent-soft:#e4eef6;
  --theory:#2f6f9f; --formula:#7a4fb0; --calc:#b5562a; --scenario:#2e7d5b;
  --good:#2e7d5b; --bad:#b5562a; --code:#f1ece1;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 28px rgba(40,30,10,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16150f; --panel:#201e17; --ink:#efe9dc; --muted:#a59e8e; --line:#36322a;
    --accent-soft:#2b2a22; --code:#2a2820;
    --theory:#7db4dd; --formula:#b99be0; --calc:#e8916a; --scenario:#6fc39c; --good:#6fc39c; --bad:#e8916a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#16150f; --panel:#201e17; --ink:#efe9dc; --muted:#a59e8e; --line:#36322a;
  --accent-soft:#2b2a22; --code:#2a2820;
  --theory:#7db4dd; --formula:#b99be0; --calc:#e8916a; --scenario:#6fc39c; --good:#6fc39c; --bad:#e8916a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.kicker{font:600 12px/1 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{margin:6px 0 0;font-size:clamp(24px,5vw,34px);line-height:1.1;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:15px;margin-top:4px}
.toplinks{display:flex;gap:8px;font:14px ui-sans-serif,system-ui,sans-serif}
.toplinks a,.toplinks button{color:var(--muted);text-decoration:none;border:1px solid var(--line);background:var(--panel);padding:6px 10px;border-radius:8px;cursor:pointer;font:inherit}
.toplinks a:hover,.toplinks button:hover{color:var(--ink)}
.ui{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 10px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:5px 12px;font:13px ui-sans-serif,system-ui,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.7;margin-left:4px}
.spacer{flex:1}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 4px}
.progress>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font:13px ui-sans-serif,system-ui,sans-serif}
.stage{perspective:1600px;margin-top:14px}
.card{position:relative;width:100%;min-height:380px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1);cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:26px 26px 22px;display:flex;flex-direction:column;overflow:auto}
.back{transform:rotateY(180deg)}
.tag{align-self:flex-start;font:600 11px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;border-radius:6px;border:1px solid currentColor}
.t-theory{color:var(--theory)} .t-formula{color:var(--formula)} .t-calc{color:var(--calc)} .t-scenario{color:var(--scenario)}
.front .q{font-size:clamp(20px,3.6vw,26px);line-height:1.35;margin:auto 0;padding:18px 0}
.front .hint{color:var(--muted);font:13px ui-sans-serif,system-ui,sans-serif}
.back .qsmall{color:var(--muted);font-size:14px;margin:12px 0 8px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.ans{font-size:16.5px}
.ans p{margin:.5em 0}
.ans ul,.ans ol{margin:.4em 0;padding-left:1.3em}
.ans li{margin:.2em 0}
.f{display:block;background:var(--code);border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;border-radius:6px;font:15px/1.6 ui-monospace,"SF Mono",Menlo,Consolas,monospace;overflow-x:auto;white-space:pre-wrap}
code{background:var(--code);padding:1px 5px;border-radius:4px;font:.92em ui-monospace,Menlo,Consolas,monospace}
table.t{border-collapse:collapse;margin:8px 0;font:14px ui-sans-serif,system-ui,sans-serif;max-width:100%;display:block;overflow-x:auto}
table.t th,table.t td{border:1px solid var(--line);padding:4px 9px;text-align:center}
table.t th{background:var(--accent-soft)}
.key{color:var(--accent);font-weight:700}
.tip{margin-top:10px;padding:8px 12px;border-radius:8px;background:var(--accent-soft);font:14px/1.5 ui-sans-serif,system-ui,sans-serif}
.tip b{color:var(--accent)}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:11px 10px;border-radius:10px;font:600 14px ui-sans-serif,system-ui,sans-serif;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.rate{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.btn.good{color:var(--good)} .btn.bad{color:var(--bad)}
.status{font:600 12px ui-sans-serif,system-ui,sans-serif;margin-left:auto}
.status.k{color:var(--good)} .status.r{color:var(--bad)}
.keys{color:var(--muted);font:12px ui-sans-serif,system-ui,sans-serif;text-align:center;margin-top:12px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font:11px ui-monospace,monospace;background:var(--panel)}
.list{display:none;margin-top:16px}
.list.on{display:block}
.litem{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:10px 0}
.litem h3{font-size:18px;margin:8px 0 6px;line-height:1.35}
.empty{text-align:center;color:var(--muted);padding:60px 10px;font-family:ui-sans-serif,system-ui,sans-serif}
svg text{font-family:ui-sans-serif,system-ui,sans-serif}
@media (max-width:560px){.face{padding:18px 16px}.card{min-height:440px}.keys{display:none}}
@media print{.bar,.stage,.controls,.rate,.keys,.toplinks,.progress,.meta{display:none!important}.list{display:block!important}.litem{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="kicker">IS328 · Topic 1 of 12</div>
      <h1>Data Pre-processing</h1>
      <div class="sub">Encoding, normalisation and distance measures</div>
    </div>
    <div class="toplinks">
      <a href="index.html">All topics</a>
      <button id="theme" type="button" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <div class="bar ui" id="filters"></div>
  <div class="bar ui">
    <button class="chip" id="shuffle" type="button">Shuffle</button>
    <button class="chip" id="onlyReview" type="button" aria-pressed="false">Only “review again”</button>
    <button class="chip" id="listView" type="button" aria-pressed="false">List view</button>
    <span class="spacer"></span>
    <button class="chip" id="reset" type="button">Reset marks</button>
  </div>
  <div class="progress"><i id="prog"></i></div>
  <div class="meta"><span id="pos"></span><span id="score"></span></div>

  <div id="studyArea">
    <div class="stage"><div class="card" id="card" tabindex="0" aria-live="polite">
      <div class="face front" id="front"></div>
      <div class="face back" id="back"></div>
    </div></div>
    <div class="controls">
      <button class="btn" id="prev" type="button">← Prev</button>
      <button class="btn primary" id="flip" type="button">Flip</button>
      <button class="btn" id="next" type="button">Next →</button>
    </div>
    <div class="rate">
      <button class="btn bad" id="markR" type="button">✗ Review again</button>
      <button class="btn good" id="markK" type="button">✓ Got it</button>
    </div>
    <div class="keys"><kbd>Space</kbd> flip · <kbd>←</kbd><kbd>→</kbd> move · <kbd>1</kbd> review again · <kbd>2</kbd> got it</div>
  </div>
  <div class="list" id="list"></div>
</div>

<script>
const CARDS = [{"type": "theory", "q": "Why do we pre-process data before mining?", "a": "<p>Real-world data is <span class='key'>incomplete<\/span> (missing values), <span class='key'>noisy<\/span> (errors/outliers) and <span class='key'>inconsistent<\/span> (different codes/units). Quality data → quality mining results.<\/p><p>Main tasks (Han ch. 3):<\/p><ul><li><b>Cleaning<\/b> – fill missing values, smooth noise, remove outliers, fix inconsistencies<\/li><li><b>Integration<\/b> – merge sources, resolve redundancy (correlation analysis)<\/li><li><b>Reduction<\/b> – dimensionality (PCA, attribute subset), numerosity (sampling, histograms, clustering)<\/li><li><b>Transformation<\/b> – normalisation, discretisation, encoding, concept hierarchies<\/li><\/ul>"}, {"type": "theory", "q": "Name the attribute types and give an example of each.", "a": "<table class=\"t\"><tr><th>Type<\/th><th>Meaning<\/th><th>Example<\/th><\/tr><tr><td>Nominal<\/td><td>categories, no order<\/td><td>colour, occupation<\/td><\/tr><tr><td>Binary – symmetric<\/td><td>2 states, equally important<\/td><td>gender<\/td><\/tr><tr><td>Binary – asymmetric<\/td><td>outcomes not equally important (1 = rare/important)<\/td><td>test positive<\/td><\/tr><tr><td>Ordinal<\/td><td>ordered, gaps unknown<\/td><td>small < medium < large<\/td><\/tr><tr><td>Numeric – interval<\/td><td>equal units, no true zero<\/td><td>°C, dates<\/td><\/tr><tr><td>Numeric – ratio<\/td><td>true zero, ratios meaningful<\/td><td>income, age<\/td><\/tr><\/table><div class=\"tip\"><b>Exam tip:<\/b> The attribute type decides which distance formula you use — identify it first.<\/div>"}, {"type": "theory", "q": "How can missing values be handled?", "a": "<ol><li>Ignore the tuple (only when class label missing / few missing)<\/li><li>Fill in manually<\/li><li>Use a global constant (e.g. “Unknown”)<\/li><li>Use the attribute <b>mean/median<\/b><\/li><li>Use the mean/median of the <b>same class<\/b><\/li><li>Use the <b>most probable value<\/b> (regression, Bayesian, decision tree)<\/li><\/ol><p>Options 4–6 bias the data but are most popular; 6 uses the most information.<\/p>"}, {"type": "theory", "q": "Label encoding vs one-hot encoding — when should each be used?", "a": "<p><b>Label (ordinal/integer) encoding<\/b>: map categories to 1,2,3… Only appropriate for <span class='key'>ordinal<\/span> data (low=1, med=2, high=3) because it implies order and distance.<\/p><p><b>One-hot encoding<\/b>: one binary column per category (Red→[1,0,0], Green→[0,1,0], Blue→[0,0,1]). Use for <span class='key'>nominal<\/span> data so no false ordering is introduced.<\/p><p>Drawback of one-hot: many columns for high-cardinality attributes (curse of dimensionality).<\/p>"}, {"type": "formula", "q": "State the min-max normalisation formula.", "a": "<span class=\"f\">v' = (v − min<sub>A<\/sub>) / (max<sub>A<\/sub> − min<sub>A<\/sub>) × (new_max − new_min) + new_min<\/span><p>For the usual [0,1] range: <code>v' = (v − min)/(max − min)<\/code>.<\/p><p>Preserves relationships between values; gives an “out-of-bounds” error if future data falls outside the original range. Sensitive to outliers.<\/p>"}, {"type": "calc", "q": "Income ranges from $12,000 to $98,000. Min-max normalise $73,600 to [0.0, 1.0].", "a": "<span class=\"f\">v' = (73,600 − 12,000) / (98,000 − 12,000)\n   = 61,600 / 86,000\n   = 0.716<\/span><p>(Han Example 3.4)<\/p>"}, {"type": "formula", "q": "State the z-score normalisation formula. When is it preferred?", "a": "<span class=\"f\">v' = (v − Ā) / σ<sub>A<\/sub><\/span><p>Ā = mean, σ = standard deviation. Result has mean 0 and std 1.<\/p><p>Preferred when the actual min/max are <b>unknown<\/b> or when <b>outliers<\/b> dominate min-max. Variant: replace σ by mean absolute deviation s<sub>A<\/sub> = (1/n)Σ|v − Ā| (more robust to outliers).<\/p>"}, {"type": "calc", "q": "Mean income = $54,000, std = $16,000. Find the z-score of $73,600.", "a": "<span class=\"f\">v' = (73,600 − 54,000) / 16,000\n   = 19,600 / 16,000\n   = 1.225<\/span><p>Interpretation: $73,600 is 1.225 standard deviations above the mean.<\/p>"}, {"type": "calc", "q": "Values of A range from −986 to 917. Normalise by decimal scaling.", "a": "<span class=\"f\">v' = v / 10<sup>j<\/sup>, j = smallest integer so max|v'| &lt; 1\nmax|v| = 986 → j = 3\n−986 → −0.986     917 → 0.917<\/span>"}, {"type": "formula", "q": "Give the Minkowski distance family (Manhattan, Euclidean, supremum).", "a": "<span class=\"f\">d(i,j) = ( Σ<sub>f<\/sub> |x<sub>if<\/sub> − x<sub>jf<\/sub>|<sup>h<\/sup> )<sup>1/h<\/sup>\nh = 1 → Manhattan (city-block)   Σ|x<sub>if<\/sub> − x<sub>jf<\/sub>|\nh = 2 → Euclidean               √Σ(x<sub>if<\/sub> − x<sub>jf<\/sub>)²\nh → ∞ → Supremum (L<sub>max<\/sub>, Chebyshev)  max<sub>f<\/sub>|x<sub>if<\/sub> − x<sub>jf<\/sub>|<\/span><p>All are <b>metrics<\/b>: non-negativity, identity (d(i,i)=0), symmetry, triangle inequality.<\/p>"}, {"type": "calc", "q": "x₁ = (1, 2), x₂ = (3, 5). Compute the Manhattan, Euclidean and supremum distances.", "a": "<span class=\"f\">Differences: |1−3| = 2, |2−5| = 3\nManhattan = 2 + 3 = 5\nEuclidean = √(2² + 3²) = √13 = 3.61\nSupremum  = max(2, 3) = 3<\/span><p>(Han Example 2.18)<\/p>"}, {"type": "formula", "q": "How is dissimilarity computed for nominal attributes?", "a": "<span class=\"f\">d(i,j) = (p − m) / p<\/span><p>p = total number of nominal attributes, m = number of <b>matches<\/b>. Similarity sim = m/p = 1 − d.<\/p><p>Alternative: one-hot encode, then use binary measures.<\/p>"}, {"type": "formula", "q": "Give the contingency-table dissimilarity formulas for symmetric binary, asymmetric binary and the Jaccard coefficient.", "a": "<table class=\"t\"><tr><th><\/th><th>j = 1<\/th><th>j = 0<\/th><\/tr><tr><td><b>i = 1<\/b><\/td><td>q<\/td><td>r<\/td><\/tr><tr><td><b>i = 0<\/b><\/td><td>s<\/td><td>t<\/td><\/tr><\/table><span class=\"f\">Symmetric binary:  d = (r + s) / (q + r + s + t)\nAsymmetric binary: d = (r + s) / (q + r + s)      ← ignore t (0–0 matches)\nJaccard similarity: sim = q / (q + r + s) = 1 − d<sub>asym<\/sub><\/span><p>Negative matches (t) are ignored for asymmetric attributes because two patients both <i>not<\/i> having a rare symptom says little.<\/p>"}, {"type": "calc", "q": "Asymmetric binary (Y/P = 1, N = 0). Jack: M,Y,N,P,N,N,N · Mary: F,Y,N,P,N,P,N · Jim: M,Y,P,N,N,N,N (first attr gender is symmetric, ignore it). Find d(Jack, Mary), d(Jack, Jim), d(Jim, Mary).", "a": "<p>Attributes: fever, cough, test1–test4.<\/p><span class=\"f\">Jack = 1 0 1 0 0 0   Mary = 1 0 1 0 1 0   Jim = 1 1 0 0 0 0\n\nJack–Mary: q=2 r=0 s=1 → d = (0+1)/(2+0+1) = 0.33\nJack–Jim : q=1 r=1 s=1 → d = (1+1)/(1+1+1) = 0.67\nJim–Mary : q=1 r=1 s=2 → d = (1+2)/(1+1+2) = 0.75<\/span><p>Jack and Mary are most likely to have a similar disease. (Han Example 2.17)<\/p>"}, {"type": "formula", "q": "How do you include an ordinal attribute in a distance calculation?", "a": "<ol><li>Replace each value by its rank r<sub>if<\/sub> ∈ {1,…,M<sub>f<\/sub>}<\/li><li>Map to [0,1]: <span class=\"f\">z<sub>if<\/sub> = (r<sub>if<\/sub> − 1) / (M<sub>f<\/sub> − 1)<\/span><\/li><li>Treat z as numeric (e.g. |z<sub>i<\/sub> − z<sub>j<\/sub>|)<\/li><\/ol><p>Example: fair/good/excellent → ranks 1,2,3 → z = 0, 0.5, 1.<\/p>"}, {"type": "formula", "q": "Give the dissimilarity formula for objects with mixed attribute types.", "a": "<span class=\"f\">d(i,j) = Σ<sub>f<\/sub> δ<sub>ij<\/sub><sup>(f)<\/sup> d<sub>ij<\/sub><sup>(f)<\/sup>  /  Σ<sub>f<\/sub> δ<sub>ij<\/sub><sup>(f)<\/sup><\/span><ul><li>δ = 0 if a value is missing, or both are 0 for an asymmetric binary attribute; otherwise δ = 1<\/li><li>Numeric: d = |x<sub>if<\/sub> − x<sub>jf<\/sub>| / (max − min)<\/li><li>Nominal/binary: d = 0 if equal, else 1<\/li><li>Ordinal: convert to z = (r−1)/(M−1), then treat as numeric<\/li><\/ul><p>Every term is in [0,1], so the result is in [0,1].<\/p>"}, {"type": "calc", "q": "Mixed types: object 1 = (code-A, excellent, 45), object 3 = (code-C, good, 64). test-1 nominal, test-2 ordinal (fair &lt; good &lt; excellent), test-3 numeric with min 22, max 64. Compute d(3,1).", "a": "<span class=\"f\">test-1 nominal: A ≠ C → d = 1\ntest-2 ordinal: excellent z=1, good z=0.5 → |1 − 0.5| = 0.5\ntest-3 numeric: |64 − 45| / (64 − 22) = 19/42 = 0.45\n\nd(3,1) = (1 + 0.5 + 0.45) / 3 = 0.65<\/span><p>(Han Example 2.22)<\/p>"}, {"type": "formula", "q": "State the cosine similarity formula. When is it used?", "a": "<span class=\"f\">cos(x, y) = (x · y) / (‖x‖ ‖y‖)<\/span><p>Used for sparse, high-dimensional vectors (documents, term-frequency vectors, ratings) where 0–0 matches should not count. Ranges 0–1 for non-negative data; 1 = same direction. Ignores vector length.<\/p>"}, {"type": "calc", "q": "x = (5,0,3,0,2,0,0,2,0,0), y = (3,0,2,0,1,1,0,1,0,1). Compute cosine similarity.", "a": "<span class=\"f\">x·y = 5×3 + 3×2 + 2×1 + 2×1 = 25\n‖x‖ = √(25+9+4+4) = √42 = 6.481\n‖y‖ = √(9+4+1+1+1+1) = √17 = 4.123\ncos = 25 / (6.481 × 4.123) = 0.94<\/span><p>Documents are very similar. (Han Example 2.23)<\/p>"}, {"type": "theory", "q": "Why must numeric attributes be normalised before distance-based methods (kNN, k-means)?", "a": "<p>Attributes with large ranges dominate the distance. E.g. income (0–100,000) vs age (0–100): a $1000 difference outweighs a 50-year age difference.<\/p><p>Normalising (min-max or z-score) gives each attribute <b>equal weight<\/b>. Also improves convergence of neural networks/gradient methods.<\/p>"}, {"type": "theory", "q": "Describe binning for smoothing noisy data.", "a": "<p>Sort values, partition into bins (equal-width or equal-frequency/depth), then smooth:<\/p><ul><li><b>by bin means<\/b> – replace each value by the bin mean<\/li><li><b>by bin medians<\/b><\/li><li><b>by bin boundaries<\/b> – replace by the closer of bin min / max<\/li><\/ul><p>Example (equal-frequency, 3 per bin): 4, 8, 15 | 21, 21, 24 | 25, 28, 34 → means: 9,9,9 | 22,22,22 | 29,29,29.<\/p>"}];
const KEY = "is328-fc-01-preprocessing";
const LABEL = {theory:"Theory", formula:"Formula", calc:"Calculation", scenario:"Scenario"};
let marks = {};
try { marks = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e) { marks = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch(e){} }

let filter = "all", onlyReview = false, order = CARDS.map((_,i)=>i), deck = [], idx = 0;
const $ = id => document.getElementById(id);

function buildFilters(){
  const counts = {all:CARDS.length};
  CARDS.forEach(c => counts[c.type] = (counts[c.type]||0)+1);
  const f = $("filters"); f.innerHTML = "";
  ["all","theory","formula","calc","scenario"].forEach(t=>{
    if(!counts[t]) return;
    const b = document.createElement("button");
    b.className="chip"; b.type="button";
    b.setAttribute("aria-pressed", t===filter);
    b.innerHTML = (t==="all"?"All cards":LABEL[t]) + '<span class="n">'+counts[t]+'</span>';
    b.onclick = ()=>{ filter=t; buildFilters(); rebuild(); };
    f.appendChild(b);
  });
}
function rebuild(keepCard){
  const cur = deck[idx];
  deck = order.filter(i => (filter==="all"||CARDS[i].type===filter) && (!onlyReview || marks[i]==="r"));
  idx = keepCard!=null && deck.includes(cur) ? deck.indexOf(cur) : 0;
  render(); renderList();
}
function tagHTML(t){ return '<span class="tag t-'+t+'">'+LABEL[t]+'</span>'; }
function statusHTML(i){
  if(marks[i]==="k") return '<span class="status k">✓ Got it</span>';
  if(marks[i]==="r") return '<span class="status r">✗ Review again</span>';
  return "";
}
function render(){
  const card = $("card"); card.classList.remove("flipped");
  const known = Object.values(marks).filter(v=>v==="k").length;
  $("score").textContent = known + " / " + CARDS.length + " marked “got it”";
  $("prog").style.width = (100*known/CARDS.length) + "%";
  if(!deck.length){
    $("front").innerHTML = '<div class="empty">No cards here.<br>'+(onlyReview?"Nothing marked “review again” — nice.":"")+'</div>';
    $("back").innerHTML = ""; $("pos").textContent = "0 / 0"; return;
  }
  const i = deck[idx], c = CARDS[i];
  $("pos").textContent = "Card " + (idx+1) + " / " + deck.length;
  setTimeout(()=>{ // swap content after flip-back starts so the answer never flashes
    $("front").innerHTML = '<div style="display:flex;align-items:center;gap:8px">'+tagHTML(c.type)+statusHTML(i)+'</div><div class="q">'+c.q+'</div><div class="hint">Click card or press Space to reveal</div>';
    $("back").innerHTML = '<div style="display:flex;align-items:center;gap:8px">'+tagHTML(c.type)+statusHTML(i)+'</div><div class="qsmall">'+c.q+'</div><div class="ans">'+c.a+'</div>';
    $("front").scrollTop = 0; $("back").scrollTop = 0;
    card.style.height = "auto";
    const h = Math.max(380, $("front").scrollHeight, $("back").scrollHeight);
    card.style.height = h + "px";
  }, card.dataset.init ? 120 : 0);
  card.dataset.init = 1;
}
function renderList(){
  $("list").innerHTML = deck.map((i,n)=>{
    const c = CARDS[i];
    return '<div class="litem">'+tagHTML(c.type)+' '+statusHTML(i)+'<h3>'+(n+1)+'. '+c.q+'</h3><div class="ans">'+c.a+'</div></div>';
  }).join("") || '<div class="empty">No cards here.</div>';
}
function flip(){ if(deck.length) $("card").classList.toggle("flipped"); }
function move(d){ if(!deck.length) return; idx = (idx + d + deck.length) % deck.length; render(); }
function mark(v){
  if(!deck.length) return;
  const i = deck[idx]; marks[i] = v; save();
  if(onlyReview && v==="k"){ rebuild(); return; }
  move(1); renderList();
}
$("card").onclick = e => { if(!e.target.closest("a")) flip(); };
$("flip").onclick = flip; $("prev").onclick = ()=>move(-1); $("next").onclick = ()=>move(1);
$("markK").onclick = ()=>mark("k"); $("markR").onclick = ()=>mark("r");
$("shuffle").onclick = ()=>{ for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];} rebuild(); };
$("onlyReview").onclick = function(){ onlyReview=!onlyReview; this.setAttribute("aria-pressed",onlyReview); rebuild(); };
$("listView").onclick = function(){ const on = this.getAttribute("aria-pressed")!=="true"; this.setAttribute("aria-pressed",on); $("list").classList.toggle("on",on); $("studyArea").style.display = on?"none":""; };
$("reset").onclick = ()=>{ marks={}; save(); rebuild(true); };
$("theme").onclick = ()=>{ const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark?"light":"dark"; };
document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.key===" "||e.key==="Enter"){ e.preventDefault(); flip(); }
  else if(e.key==="ArrowRight") move(1);
  else if(e.key==="ArrowLeft") move(-1);
  else if(e.key==="1") mark("r");
  else if(e.key==="2") mark("k");
});
buildFilters(); rebuild();
</script>
</body>
