<style>

*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;min-height:100vh}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.kicker{font:600 12px/1 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{margin:6px 0 0;font-size:clamp(24px,5vw,34px);line-height:1.1;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:15px;margin-top:4px}
.toplinks{display:flex;gap:8px;font:14px ui-sans-serif,system-ui,sans-serif}
.toplinks a,.toplinks button{color:var(--muted);text-decoration:none;border:1px solid var(--line);background:var(--panel);padding:6px 10px;border-radius:8px;cursor:pointer;font:inherit}
.toplinks a:hover,.toplinks button:hover{color:var(--ink)}
.ui{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 10px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:5px 12px;font:13px ui-sans-serif,system-ui,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.7;margin-left:4px}
.spacer{flex:1}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 4px}
.progress>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font:13px ui-sans-serif,system-ui,sans-serif}
.stage{perspective:1600px;margin-top:14px}
.card{position:relative;width:100%;min-height:380px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1);cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:26px 26px 22px;display:flex;flex-direction:column;overflow:auto}
.back{transform:rotateY(180deg)}
.tag{align-self:flex-start;font:600 11px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;border-radius:6px;border:1px solid currentColor}
.t-theory{color:var(--theory)} .t-formula{color:var(--formula)} .t-calc{color:var(--calc)} .t-scenario{color:var(--scenario)}
.front .q{font-size:clamp(20px,3.6vw,26px);line-height:1.35;margin:auto 0;padding:18px 0}
.front .hint{color:var(--muted);font:13px ui-sans-serif,system-ui,sans-serif}
.back .qsmall{color:var(--muted);font-size:14px;margin:12px 0 8px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.ans{font-size:16.5px}
.ans p{margin:.5em 0}
.ans ul,.ans ol{margin:.4em 0;padding-left:1.3em}
.ans li{margin:.2em 0}
.f{display:block;background:var(--code);border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;border-radius:6px;font:15px/1.6 ui-monospace,"SF Mono",Menlo,Consolas,monospace;overflow-x:auto;white-space:pre-wrap}
code{background:var(--code);padding:1px 5px;border-radius:4px;font:.92em ui-monospace,Menlo,Consolas,monospace}
table.t{border-collapse:collapse;margin:8px 0;font:14px ui-sans-serif,system-ui,sans-serif;max-width:100%;display:block;overflow-x:auto}
table.t th,table.t td{border:1px solid var(--line);padding:4px 9px;text-align:center}
table.t th{background:var(--accent-soft)}
.key{color:var(--accent);font-weight:700}
.tip{margin-top:10px;padding:8px 12px;border-radius:8px;background:var(--accent-soft);font:14px/1.5 ui-sans-serif,system-ui,sans-serif}
.tip b{color:var(--accent)}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:11px 10px;border-radius:10px;font:600 14px ui-sans-serif,system-ui,sans-serif;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.rate{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.btn.good{color:var(--good)} .btn.bad{color:var(--bad)}
.status{font:600 12px ui-sans-serif,system-ui,sans-serif;margin-left:auto}
.status.k{color:var(--good)} .status.r{color:var(--bad)}
.keys{color:var(--muted);font:12px ui-sans-serif,system-ui,sans-serif;text-align:center;margin-top:12px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font:11px ui-monospace,monospace;background:var(--panel)}
.list{display:none;margin-top:16px}
.list.on{display:block}
.litem{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:10px 0}
.litem h3{font-size:18px;margin:8px 0 6px;line-height:1.35}
.empty{text-align:center;color:var(--muted);padding:60px 10px;font-family:ui-sans-serif,system-ui,sans-serif}
svg text{font-family:ui-sans-serif,system-ui,sans-serif}
@media (max-width:560px){.face{padding:18px 16px}.card{min-height:440px}.keys{display:none}}
@media print{.bar,.stage,.controls,.rate,.keys,.toplinks,.progress,.meta{display:none!important}.list{display:block!important}.litem{break-inside:avoid}}

<script>
const CARDS = [{"type": "theory", "q": "What is cluster analysis? What makes a good clustering?", "a": "<p>Grouping objects so that objects in the same cluster are <b>similar<\/b> and objects in different clusters are <b>dissimilar<\/b>. It is <b>unsupervised<\/b> learning — no class labels.<\/p><p>Good clustering: high <b>intra-cluster similarity<\/b> (compact), low <b>inter-cluster similarity<\/b> (well separated).<\/p>"}, {"type": "theory", "q": "Name the main categories of clustering methods.", "a": "<ul><li><b>Partitioning<\/b> – k partitions, iterative relocation (k-means, k-medoids)<\/li><li><b>Hierarchical<\/b> – tree of clusters (agglomerative AGNES, divisive DIANA)<\/li><li><b>Density-based<\/b> – grow clusters in dense regions, find arbitrary shapes (DBSCAN)<\/li><li><b>Grid-based<\/b> – quantise space into cells (STING)<\/li><\/ul>"}, {"type": "theory", "q": "Outline the k-means algorithm.", "a": "<ol><li>Choose k; pick k objects as initial centroids<\/li><li><b>Assign<\/b> each object to the nearest centroid (usually Euclidean)<\/li><li><b>Update<\/b> each centroid = mean of its assigned objects<\/li><li>Repeat 2–3 until assignments no longer change (convergence)<\/li><\/ol><span class=\"f\">Objective: minimise E = Σ<sub>i=1..k<\/sub> Σ<sub>p∈C<sub>i<\/sub><\/sub> dist(p, c<sub>i<\/sub>)²  (within-cluster SSE)<\/span><p>Complexity O(nkt) — efficient.<\/p>"}, {"type": "calc", "q": "k-means, k = 3, Euclidean. Points: A1(2, 10), A2(2, 5), A3(8, 4), B1(5, 8), B2(7, 5), B3(6, 4), C1(1, 2), C2(4, 9). Initial centroids A1, B1, C1. Do iteration 1.", "a": "<table class=\"t\"><tr><th>Point<\/th><th>d to c1(2,10)<\/th><th>d to c2(5,8)<\/th><th>d to c3(1,2)<\/th><th>Cluster<\/th><\/tr><tr><td>A1(2, 10)<\/td><td>0.00<\/td><td>3.61<\/td><td>8.06<\/td><td>c1<\/td><\/tr><tr><td>A2(2, 5)<\/td><td>5.00<\/td><td>4.24<\/td><td>3.16<\/td><td>c3<\/td><\/tr><tr><td>A3(8, 4)<\/td><td>8.49<\/td><td>5.00<\/td><td>7.28<\/td><td>c2<\/td><\/tr><tr><td>B1(5, 8)<\/td><td>3.61<\/td><td>0.00<\/td><td>7.21<\/td><td>c2<\/td><\/tr><tr><td>B2(7, 5)<\/td><td>7.07<\/td><td>3.61<\/td><td>6.71<\/td><td>c2<\/td><\/tr><tr><td>B3(6, 4)<\/td><td>7.21<\/td><td>4.12<\/td><td>5.39<\/td><td>c2<\/td><\/tr><tr><td>C1(1, 2)<\/td><td>8.06<\/td><td>7.21<\/td><td>0.00<\/td><td>c3<\/td><\/tr><tr><td>C2(4, 9)<\/td><td>2.24<\/td><td>1.41<\/td><td>7.62<\/td><td>c2<\/td><\/tr><\/table><span class=\"f\">c1: {A1} → new centroid (2.00, 10.00)\nc2: {A3, B1, B2, B3, C2} → new centroid (6.00, 6.00)\nc3: {A2, C1} → new centroid (1.50, 3.50)<\/span><p>Continue until no point changes cluster. Repeating, the clusters stop changing by iteration 4: {A1, B1, C2}; {A3, B2, B3}; {A2, C1} with centroids (3.67, 9.00), (7.00, 4.33), (1.50, 3.50) (SSE = 14.33).<\/p><div class=\"tip\"><b>Exam tip:<\/b> Show a distance table for every iteration — that's where the method marks are.<\/div>"}, {"type": "theory", "q": "What are the weaknesses of k-means?", "a": "<ul><li>Must specify <b>k<\/b> in advance<\/li><li>Result depends on <b>initial centroids<\/b> (local optimum) — run several times / k-means++<\/li><li><b>Sensitive to outliers<\/b> (mean is pulled)<\/li><li>Only finds <b>spherical/convex<\/b>, similar-size clusters<\/li><li>Needs a defined mean → not directly for nominal data (use k-modes)<\/li><\/ul>"}, {"type": "theory", "q": "How does k-medoids (PAM) differ from k-means?", "a": "<p>Uses an actual object (the <b>medoid<\/b>, most centrally located) as the representative instead of the mean. Minimises the sum of absolute dissimilarities. Swaps medoids with non-medoids if total cost decreases.<\/p><p>✓ More robust to outliers and noise. ✗ More expensive: O(k(n−k)²) per iteration.<\/p>"}, {"type": "theory", "q": "How do you choose k?", "a": "<ul><li><b>Elbow method<\/b>: plot within-cluster SSE vs k; choose k at the “elbow” where adding clusters stops giving large drops<\/li><li>Rule of thumb k ≈ √(n/2)<\/li><li>Cross-validation; silhouette coefficient (closer to 1 = better)<\/li><li>Domain knowledge<\/li><\/ul>"}, {"type": "theory", "q": "Agglomerative vs divisive hierarchical clustering?", "a": "<p><b>Agglomerative (bottom-up, AGNES)<\/b>: start with each object as its own cluster; repeatedly merge the two closest clusters until one cluster remains (or a stop condition).<\/p><p><b>Divisive (top-down, DIANA)<\/b>: start with all objects in one cluster; repeatedly split until each object is alone.<\/p><p>Neither needs k in advance. Merges/splits can't be undone.<\/p>"}, {"type": "formula", "q": "Define single, complete, average and centroid linkage.", "a": "<span class=\"f\">Single (min):    d(C<sub>i<\/sub>,C<sub>j<\/sub>) = min  |p − p'|\nComplete (max):  d(C<sub>i<\/sub>,C<sub>j<\/sub>) = max  |p − p'|\nAverage:         d = (1/(n<sub>i<\/sub>n<sub>j<\/sub>)) Σ Σ |p − p'|\nCentroid/mean:   d = |m<sub>i<\/sub> − m<sub>j<\/sub>|<\/span><p>Single → long “chained” clusters (nearest-neighbour). Complete → compact clusters, sensitive to outliers (farthest-neighbour). Average is a compromise.<\/p>"}, {"type": "theory", "q": "What is a dendrogram and how do you use it?", "a": "<p>A tree diagram recording the sequence of merges (or splits). Leaves = objects; the <b>height<\/b> of each join = the distance at which those clusters merged.<\/p><p>Cut the dendrogram horizontally at a chosen height: the number of vertical lines crossed = number of clusters.<\/p>"}, {"type": "calc", "q": "Single-linkage agglomerative clustering on this distance matrix. Show the merges and dendrogram.<table class=\"t\"><tr><th><\/th><th>a<\/th><th>b<\/th><th>c<\/th><th>d<\/th><th>e<\/th><\/tr><tr><td><b>a<\/b><\/td><td>0<\/td><td>2<\/td><td>6<\/td><td>10<\/td><td>9<\/td><\/tr><tr><td><b>b<\/b><\/td><td>2<\/td><td>0<\/td><td>5<\/td><td>9<\/td><td>8<\/td><\/tr><tr><td><b>c<\/b><\/td><td>6<\/td><td>5<\/td><td>0<\/td><td>4<\/td><td>5<\/td><\/tr><tr><td><b>d<\/b><\/td><td>10<\/td><td>9<\/td><td>4<\/td><td>0<\/td><td>3<\/td><\/tr><tr><td><b>e<\/b><\/td><td>9<\/td><td>8<\/td><td>5<\/td><td>3<\/td><td>0<\/td><\/tr><\/table>", "a": "<table class=\"t\"><tr><th>Step<\/th><th>Merge<\/th><th>Distance<\/th><\/tr><tr><td>1<\/td><td>{a} + {b}<\/td><td>2<\/td><\/tr><tr><td>2<\/td><td>{d} + {e}<\/td><td>3<\/td><\/tr><tr><td>3<\/td><td>{c} + {d,e}<\/td><td>4<\/td><\/tr><tr><td>4<\/td><td>{a,b} + {c,d,e}<\/td><td>5<\/td><\/tr><\/table><p>Each step: find the smallest entry, merge, then update the matrix with the <b>min<\/b> distance to the new cluster (e.g. d(c,{d,e}) = min(4,5) = 4).<\/p><svg viewBox=\"0 0 360 200\" width=\"100%\" style=\"max-width:420px\" role=\"img\" aria-label=\"Dendrogram\"><text x=\"30.0\" y=\"190\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">a<\/text><text x=\"105.0\" y=\"190\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">b<\/text><text x=\"180.0\" y=\"190\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">c<\/text><text x=\"255.0\" y=\"190\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">d<\/text><text x=\"330.0\" y=\"190\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">e<\/text><line x1=\"12\" y1=\"170.0\" x2=\"12\" y2=\"30.0\" stroke=\"currentColor\" opacity=\".4\"/><text x=\"16\" y=\"118.0\" font-size=\"10\" fill=\"currentColor\" opacity=\".7\">2<\/text><text x=\"16\" y=\"90.0\" font-size=\"10\" fill=\"currentColor\" opacity=\".7\">3<\/text><text x=\"16\" y=\"62.0\" font-size=\"10\" fill=\"currentColor\" opacity=\".7\">4<\/text><text x=\"16\" y=\"34.0\" font-size=\"10\" fill=\"currentColor\" opacity=\".7\">5<\/text><path d=\"M30.0,170.0 V114.0 H105.0 V170.0\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\"/><path d=\"M255.0,170.0 V86.0 H330.0 V170.0\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\"/><path d=\"M180.0,170.0 V58.0 H292.5 V86.0\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\"/><path d=\"M67.5,114.0 V30.0 H236.25 V58.0\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\"/><\/svg><p>Cutting at height 3.5 gives 3 clusters: {a,b}, {c}, {d,e}.<\/p>"}, {"type": "calc", "q": "Same matrix, complete linkage. Show the merges and dendrogram.<table class=\"t\"><tr><th><\/th><th>a<\/th><th>b<\/th><th>c<\/th><th>d<\/th><th>e<\/th><\/tr><tr><td><b>a<\/b><\/td><td>0<\/td><td>2<\/td><td>6<\/td><td>10<\/td><td>9<\/td><\/tr><tr><td><b>b<\/b><\/td><td>2<\/td><td>0<\/td><td>5<\/td><td>9<\/td><td>8<\/td><\/tr><tr><td><b>c<\/b><\/td><td>6<\/td><td>5<\/td><td>0<\/td><td>4<\/td><td>5<\/td><\/tr><tr><td><b>d<\/b><\/td><td>10<\/td><td>9<\/td><td>4<\/td><td>0<\/td><td>3<\/td><\/tr><tr><td><b>e<\/b><\/td><td>9<\/td><td>8<\/td><td>5<\/td><td>3<\/td><td>0<\/td><\/tr><\/table>", "a": "<table class=\"t\"><tr><th>Step<\/th><th>Merge<\/th><th>Distance<\/th><\/tr><tr><td>1<\/td><td>{a} + {b}<\/td><td>2<\/td><\/tr><tr><td>2<\/td><td>{d} + {e}<\/td><td>3<\/td><\/tr><tr><td>3<\/td><td>{c} + {d,e}<\/td><td>5<\/td><\/tr><tr><td>4<\/td><td>{a,b} + {c,d,e}<\/td><td>10<\/td><\/tr><\/table><p>Update rule uses the <b>max<\/b>: d(c,{d,e}) = max(4,5) = 5; d({a,b},c) = max(6,5) = 6; d({a,b},{c,d,e}) = max(…) = 10.<\/p><svg viewBox=\"0 0 360 200\" width=\"100%\" style=\"max-width:420px\" role=\"img\" aria-label=\"Dendrogram\"><text x=\"30.0\" y=\"190\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">a<\/text><text x=\"105.0\" y=\"190\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">b<\/text><text x=\"180.0\" y=\"190\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">c<\/text><text x=\"255.0\" y=\"190\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">d<\/text><text x=\"330.0\" y=\"190\" text-anchor=\"middle\" font-size=\"13\" fill=\"currentColor\">e<\/text><line x1=\"12\" y1=\"170.0\" x2=\"12\" y2=\"30.0\" stroke=\"currentColor\" opacity=\".4\"/><text x=\"16\" y=\"146.0\" font-size=\"10\" fill=\"currentColor\" opacity=\".7\">2<\/text><text x=\"16\" y=\"132.0\" font-size=\"10\" fill=\"currentColor\" opacity=\".7\">3<\/text><text x=\"16\" y=\"104.0\" font-size=\"10\" fill=\"currentColor\" opacity=\".7\">5<\/text><text x=\"16\" y=\"34.0\" font-size=\"10\" fill=\"currentColor\" opacity=\".7\">10<\/text><path d=\"M30.0,170.0 V142.0 H105.0 V170.0\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\"/><path d=\"M255.0,170.0 V128.0 H330.0 V170.0\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\"/><path d=\"M180.0,170.0 V100.0 H292.5 V128.0\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\"/><path d=\"M67.5,142.0 V30.0 H236.25 V100.0\" fill=\"none\" stroke=\"var(--accent)\" stroke-width=\"2\"/><\/svg><p>Same merge order as single linkage here but at larger heights — complete linkage clusters join later.<\/p>"}, {"type": "calc", "q": "Same matrix, average linkage — what are the merge distances?<table class=\"t\"><tr><th><\/th><th>a<\/th><th>b<\/th><th>c<\/th><th>d<\/th><th>e<\/th><\/tr><tr><td><b>a<\/b><\/td><td>0<\/td><td>2<\/td><td>6<\/td><td>10<\/td><td>9<\/td><\/tr><tr><td><b>b<\/b><\/td><td>2<\/td><td>0<\/td><td>5<\/td><td>9<\/td><td>8<\/td><\/tr><tr><td><b>c<\/b><\/td><td>6<\/td><td>5<\/td><td>0<\/td><td>4<\/td><td>5<\/td><\/tr><tr><td><b>d<\/b><\/td><td>10<\/td><td>9<\/td><td>4<\/td><td>0<\/td><td>3<\/td><\/tr><tr><td><b>e<\/b><\/td><td>9<\/td><td>8<\/td><td>5<\/td><td>3<\/td><td>0<\/td><\/tr><\/table>", "a": "<table class=\"t\"><tr><th>Step<\/th><th>Merge<\/th><th>Distance<\/th><\/tr><tr><td>1<\/td><td>{a} + {b}<\/td><td>2<\/td><\/tr><tr><td>2<\/td><td>{d} + {e}<\/td><td>3<\/td><\/tr><tr><td>3<\/td><td>{c} + {d,e}<\/td><td>4.5<\/td><\/tr><tr><td>4<\/td><td>{a,b} + {c,d,e}<\/td><td>7.83333<\/td><\/tr><\/table><span class=\"f\">d(c,{d,e}) = (4+5)/2 = 4.5\nd({a,b},c) = (6+5)/2 = 5.5\nd({a,b},{c,d,e}) = (6+10+9+5+9+8)/6 = 47/6 = 7.83<\/span>"}, {"type": "theory", "q": "Strengths and weaknesses of hierarchical clustering?", "a": "<p>✓ No need to specify k; dendrogram is a rich visual summary; any distance measure.<\/p><p>✗ Merges/splits are final (greedy, can't undo); O(n²) memory and O(n² log n)–O(n³) time — doesn't scale; sensitive to noise/outliers (single linkage chaining).<\/p>"}, {"type": "theory", "q": "How can clustering quality be evaluated?", "a": "<ul><li><b>Extrinsic<\/b> (ground truth available): purity, precision/recall, BCubed<\/li><li><b>Intrinsic<\/b> (no labels): silhouette coefficient s = (b − a)/max(a, b), where a = mean distance to own cluster, b = mean distance to nearest other cluster; within-cluster SSE<\/li><\/ul>"}];
const KEY = "is328-fc-08-clustering";
const LABEL = {theory:"Theory", formula:"Formula", calc:"Calculation", scenario:"Scenario"};
let marks = {};
try { marks = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e) { marks = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch(e){} }

let filter = "all", onlyReview = false, order = CARDS.map((_,i)=>i), deck = [], idx = 0;
const $ = id => document.getElementById(id);

function buildFilters(){
  const counts = {all:CARDS.length};
  CARDS.forEach(c => counts[c.type] = (counts[c.type]||0)+1);
  const f = $("filters"); f.innerHTML = "";
  ["all","theory","formula","calc","scenario"].forEach(t=>{
    if(!counts[t]) return;
    const b = document.createElement("button");
    b.className="chip"; b.type="button";
    b.setAttribute("aria-pressed", t===filter);
    b.innerHTML = (t==="all"?"All cards":LABEL[t]) + '<span class="n">'+counts[t]+'</span>';
    b.onclick = ()=>{ filter=t; buildFilters(); rebuild(); };
    f.appendChild(b);
  });
}
function rebuild(keepCard){
  const cur = deck[idx];
  deck = order.filter(i => (filter==="all"||CARDS[i].type===filter) && (!onlyReview || marks[i]==="r"));
  idx = keepCard!=null && deck.includes(cur) ? deck.indexOf(cur) : 0;
  render(); renderList();
}
function tagHTML(t){ return '<span class="tag t-'+t+'">'+LABEL[t]+'</span>'; }
function statusHTML(i){
  if(marks[i]==="k") return '<span class="status k">✓ Got it</span>';
  if(marks[i]==="r") return '<span class="status r">✗ Review again</span>';
  return "";
}
function render(){
  const card = $("card"); card.classList.remove("flipped");
  const known = Object.values(marks).filter(v=>v==="k").length;
  $("score").textContent = known + " / " + CARDS.length + " marked “got it”";
  $("prog").style.width = (100*known/CARDS.length) + "%";
  if(!deck.length){
    $("front").innerHTML = '<div class="empty">No cards here.<br>'+(onlyReview?"Nothing marked “review again” — nice.":"")+'</div>';
    $("back").innerHTML = ""; $("pos").textContent = "0 / 0"; return;
  }
  const i = deck[idx], c = CARDS[i];
  $("pos").textContent = "Card " + (idx+1) + " / " + deck.length;
  setTimeout(()=>{ // swap content after flip-back starts so the answer never flashes
    $("front").innerHTML = '<div style="display:flex;align-items:center;gap:8px">'+tagHTML(c.type)+statusHTML(i)+'</div><div class="q">'+c.q+'</div><div class="hint">Click card or press Space to reveal</div>';
    $("back").innerHTML = '<div style="display:flex;align-items:center;gap:8px">'+tagHTML(c.type)+statusHTML(i)+'</div><div class="qsmall">'+c.q+'</div><div class="ans">'+c.a+'</div>';
    $("front").scrollTop = 0; $("back").scrollTop = 0;
    card.style.height = "auto";
    const h = Math.max(380, $("front").scrollHeight, $("back").scrollHeight);
    card.style.height = h + "px";
  }, card.dataset.init ? 120 : 0);
  card.dataset.init = 1;
}
function renderList(){
  $("list").innerHTML = deck.map((i,n)=>{
    const c = CARDS[i];
    return '<div class="litem">'+tagHTML(c.type)+' '+statusHTML(i)+'<h3>'+(n+1)+'. '+c.q+'</h3><div class="ans">'+c.a+'</div></div>';
  }).join("") || '<div class="empty">No cards here.</div>';
}
function flip(){ if(deck.length) $("card").classList.toggle("flipped"); }
function move(d){ if(!deck.length) return; idx = (idx + d + deck.length) % deck.length; render(); }
function mark(v){
  if(!deck.length) return;
  const i = deck[idx]; marks[i] = v; save();
  if(onlyReview && v==="k"){ rebuild(); return; }
  move(1); renderList();
}
$("card").onclick = e => { if(!e.target.closest("a")) flip(); };
$("flip").onclick = flip; $("prev").onclick = ()=>move(-1); $("next").onclick = ()=>move(1);
$("markK").onclick = ()=>mark("k"); $("markR").onclick = ()=>mark("r");
$("shuffle").onclick = ()=>{ for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];} rebuild(); };
$("onlyReview").onclick = function(){ onlyReview=!onlyReview; this.setAttribute("aria-pressed",onlyReview); rebuild(); };
$("listView").onclick = function(){ const on = this.getAttribute("aria-pressed")!=="true"; this.setAttribute("aria-pressed",on); $("list").classList.toggle("on",on); $("studyArea").style.display = on?"none":""; };
$("reset").onclick = ()=>{ marks={}; save(); rebuild(true); };
$("theme").onclick = ()=>{ const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark?"light":"dark"; };
document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.key===" "||e.key==="Enter"){ e.preventDefault(); flip(); }
  else if(e.key==="ArrowRight") move(1);
  else if(e.key==="ArrowLeft") move(-1);
  else if(e.key==="1") mark("r");
  else if(e.key==="2") mark("k");
});
buildFilters(); rebuild();
</script>
