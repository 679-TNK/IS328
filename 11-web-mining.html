<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Mining · IS328 Flashcards</title>
<style>
:root{
  --bg:#f4f1ea; --panel:#fffdf8; --ink:#1d1b16; --muted:#6b665b; --line:#e2dccf;
  --accent:#6a4a2a; --accent-soft:#f0e7dc;
  --theory:#2f6f9f; --formula:#7a4fb0; --calc:#b5562a; --scenario:#2e7d5b;
  --good:#2e7d5b; --bad:#b5562a; --code:#f1ece1;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 28px rgba(40,30,10,.08);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#16150f; --panel:#201e17; --ink:#efe9dc; --muted:#a59e8e; --line:#36322a;
    --accent-soft:#2b2a22; --code:#2a2820;
    --theory:#7db4dd; --formula:#b99be0; --calc:#e8916a; --scenario:#6fc39c; --good:#6fc39c; --bad:#e8916a;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#16150f; --panel:#201e17; --ink:#efe9dc; --muted:#a59e8e; --line:#36322a;
  --accent-soft:#2b2a22; --code:#2a2820;
  --theory:#7db4dd; --formula:#b99be0; --calc:#e8916a; --scenario:#6fc39c; --good:#6fc39c; --bad:#e8916a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 28px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.55 "Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;min-height:100vh}
.wrap{max-width:860px;margin:0 auto;padding:20px 16px 60px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.kicker{font:600 12px/1 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
h1{margin:6px 0 0;font-size:clamp(24px,5vw,34px);line-height:1.1;font-weight:700;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:15px;margin-top:4px}
.toplinks{display:flex;gap:8px;font:14px ui-sans-serif,system-ui,sans-serif}
.toplinks a,.toplinks button{color:var(--muted);text-decoration:none;border:1px solid var(--line);background:var(--panel);padding:6px 10px;border-radius:8px;cursor:pointer;font:inherit}
.toplinks a:hover,.toplinks button:hover{color:var(--ink)}
.ui{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:14px 0 10px}
.chip{border:1px solid var(--line);background:var(--panel);color:var(--muted);border-radius:999px;padding:5px 12px;font:13px ui-sans-serif,system-ui,sans-serif;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip .n{opacity:.7;margin-left:4px}
.spacer{flex:1}
.progress{height:6px;background:var(--line);border-radius:6px;overflow:hidden;margin:6px 0 4px}
.progress>i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.meta{display:flex;justify-content:space-between;color:var(--muted);font:13px ui-sans-serif,system-ui,sans-serif}
.stage{perspective:1600px;margin-top:14px}
.card{position:relative;width:100%;min-height:380px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.2,.7,.2,1);cursor:pointer}
.card.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:26px 26px 22px;display:flex;flex-direction:column;overflow:auto}
.back{transform:rotateY(180deg)}
.tag{align-self:flex-start;font:600 11px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.1em;text-transform:uppercase;padding:5px 9px;border-radius:6px;border:1px solid currentColor}
.t-theory{color:var(--theory)} .t-formula{color:var(--formula)} .t-calc{color:var(--calc)} .t-scenario{color:var(--scenario)}
.front .q{font-size:clamp(20px,3.6vw,26px);line-height:1.35;margin:auto 0;padding:18px 0}
.front .hint{color:var(--muted);font:13px ui-sans-serif,system-ui,sans-serif}
.back .qsmall{color:var(--muted);font-size:14px;margin:12px 0 8px;padding-bottom:10px;border-bottom:1px dashed var(--line)}
.ans{font-size:16.5px}
.ans p{margin:.5em 0}
.ans ul,.ans ol{margin:.4em 0;padding-left:1.3em}
.ans li{margin:.2em 0}
.f{display:block;background:var(--code);border-left:3px solid var(--accent);padding:8px 12px;margin:8px 0;border-radius:6px;font:15px/1.6 ui-monospace,"SF Mono",Menlo,Consolas,monospace;overflow-x:auto;white-space:pre-wrap}
code{background:var(--code);padding:1px 5px;border-radius:4px;font:.92em ui-monospace,Menlo,Consolas,monospace}
table.t{border-collapse:collapse;margin:8px 0;font:14px ui-sans-serif,system-ui,sans-serif;max-width:100%;display:block;overflow-x:auto}
table.t th,table.t td{border:1px solid var(--line);padding:4px 9px;text-align:center}
table.t th{background:var(--accent-soft)}
.key{color:var(--accent);font-weight:700}
.tip{margin-top:10px;padding:8px 12px;border-radius:8px;background:var(--accent-soft);font:14px/1.5 ui-sans-serif,system-ui,sans-serif}
.tip b{color:var(--accent)}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:14px}
.btn{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:11px 10px;border-radius:10px;font:600 14px ui-sans-serif,system-ui,sans-serif;cursor:pointer}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.rate{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.btn.good{color:var(--good)} .btn.bad{color:var(--bad)}
.status{font:600 12px ui-sans-serif,system-ui,sans-serif;margin-left:auto}
.status.k{color:var(--good)} .status.r{color:var(--bad)}
.keys{color:var(--muted);font:12px ui-sans-serif,system-ui,sans-serif;text-align:center;margin-top:12px}
kbd{border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;font:11px ui-monospace,monospace;background:var(--panel)}
.list{display:none;margin-top:16px}
.list.on{display:block}
.litem{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:10px 0}
.litem h3{font-size:18px;margin:8px 0 6px;line-height:1.35}
.empty{text-align:center;color:var(--muted);padding:60px 10px;font-family:ui-sans-serif,system-ui,sans-serif}
svg text{font-family:ui-sans-serif,system-ui,sans-serif}
@media (max-width:560px){.face{padding:18px 16px}.card{min-height:440px}.keys{display:none}}
@media print{.bar,.stage,.controls,.rate,.keys,.toplinks,.progress,.meta{display:none!important}.list{display:block!important}.litem{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="kicker">IS328 · Topic 11 of 12</div>
      <h1>Web Mining</h1>
      <div class="sub">PageRank, hubs and authorities (HITS)</div>
    </div>
    <div class="toplinks">
      <a href="index.html">All topics</a>
      <button id="theme" type="button" aria-label="Toggle theme">◐</button>
    </div>
  </header>

  <div class="bar ui" id="filters"></div>
  <div class="bar ui">
    <button class="chip" id="shuffle" type="button">Shuffle</button>
    <button class="chip" id="onlyReview" type="button" aria-pressed="false">Only “review again”</button>
    <button class="chip" id="listView" type="button" aria-pressed="false">List view</button>
    <span class="spacer"></span>
    <button class="chip" id="reset" type="button">Reset marks</button>
  </div>
  <div class="progress"><i id="prog"></i></div>
  <div class="meta"><span id="pos"></span><span id="score"></span></div>

  <div id="studyArea">
    <div class="stage"><div class="card" id="card" tabindex="0" aria-live="polite">
      <div class="face front" id="front"></div>
      <div class="face back" id="back"></div>
    </div></div>
    <div class="controls">
      <button class="btn" id="prev" type="button">← Prev</button>
      <button class="btn primary" id="flip" type="button">Flip</button>
      <button class="btn" id="next" type="button">Next →</button>
    </div>
    <div class="rate">
      <button class="btn bad" id="markR" type="button">✗ Review again</button>
      <button class="btn good" id="markK" type="button">✓ Got it</button>
    </div>
    <div class="keys"><kbd>Space</kbd> flip · <kbd>←</kbd><kbd>→</kbd> move · <kbd>1</kbd> review again · <kbd>2</kbd> got it</div>
  </div>
  <div class="list" id="list"></div>
</div>

<script>
const CARDS = [{"type": "theory", "q": "What are the three categories of web mining?", "a": "<ul><li><b>Web content mining<\/b> – extract knowledge from page content (text, images): classification, clustering, information extraction<\/li><li><b>Web structure mining<\/b> – analyse the hyperlink graph: <b>PageRank, HITS<\/b>, communities<\/li><li><b>Web usage mining<\/b> – analyse logs/clickstreams: navigation patterns, personalisation, recommendation<\/li><\/ul>"}, {"type": "theory", "q": "What is the intuition behind PageRank?", "a": "<p>A page is important if it is linked to by <b>many<\/b> pages, and especially by <b>important<\/b> pages. A link from page T to page A is a “vote” for A; T's vote is split equally among all its out-links.<\/p><p><b>Random surfer model<\/b>: PageRank = long-run probability that a surfer who keeps clicking random links (and occasionally jumps to a random page) is on that page. Query-independent and computed offline.<\/p>"}, {"type": "formula", "q": "State the PageRank formula.", "a": "<span class=\"f\">PR(A) = (1 − d)/N + d × Σ<sub>T→A<\/sub> PR(T) / C(T)<\/span><p>d = damping factor (usually 0.85), N = number of pages, C(T) = number of <b>out-links<\/b> of T. Sum over all pages T that link to A. Ranks sum to 1.<\/p><p>Original paper form: <code>PR(A) = (1 − d) + d Σ PR(T)/C(T)<\/code> — ranks then sum to N. Use whichever your lecture notes use; the ranking is identical.<\/p>"}, {"type": "theory", "q": "What is the role of the damping factor d?", "a": "<p>With probability d the surfer follows a random out-link; with probability 1 − d (≈ 0.15) they <b>teleport<\/b> to a random page.<\/p><p>This guarantees convergence and handles <b>rank sinks<\/b> (groups of pages with no links out that would trap rank) and <b>dangling nodes<\/b> (pages with no out-links — usually treated as linking to all pages).<\/p>"}, {"type": "calc", "q": "Graph: A → B, A → C, B → C, C → A. d = 0.85, N = 3, initial PR = 1/3. Compute two iterations of PageRank (normalised form).", "a": "<span class=\"f\">Out-links: C(A)=2, C(B)=1, C(C)=1.  In-links: A←C, B←A, C←A,B\n(1−d)/N = 0.05\n\nIteration 1:\nPR(A) = 0.05 + 0.85 × PR(C)/1           = 0.05 + 0.85(0.333)       = 0.333\nPR(B) = 0.05 + 0.85 × PR(A)/2           = 0.05 + 0.85(0.167)       = 0.192\nPR(C) = 0.05 + 0.85 × (PR(A)/2 + PR(B)) = 0.05 + 0.85(0.167+0.333) = 0.475\n\nIteration 2:\nPR(A) = 0.05 + 0.85(0.475)                 = 0.454\nPR(B) = 0.05 + 0.85(0.333/2)               = 0.192\nPR(C) = 0.05 + 0.85(0.333/2 + 0.192)     = 0.355\n\nConverged: A = 0.388, B = 0.215, C = 0.397<\/span><p>Ranking: <b>C &gt; A &gt; B<\/b>. C has the most in-links; A is high because it receives all of C's rank. (Iteration 1 uses old values for every page — Jacobi style — unless told otherwise.)<\/p>"}, {"type": "calc", "q": "Same graph (A→B, A→C, B→C, C→A) with the un-normalised form PR = (1 − d) + d Σ PR(T)/C(T), initial PR = 1. Give iteration 1 and the converged values.", "a": "<span class=\"f\">PR(A) = 0.15 + 0.85(1)         = 1.000\nPR(B) = 0.15 + 0.85(1/2)       = 0.575\nPR(C) = 0.15 + 0.85(1/2 + 1)   = 1.425\n\nConverged: A = 1.163, B = 0.644, C = 1.192  (sum = 3)<\/span><p>Exactly N × the normalised values — same ranking C &gt; A &gt; B.<\/p>"}, {"type": "theory", "q": "What are hubs and authorities (HITS)?", "a": "<p><b>Authority<\/b>: a page with good content on a topic — pointed to by many good hubs.<\/p><p><b>Hub<\/b>: a page that points to many good authorities (e.g. a resource list).<\/p><p>They <b>mutually reinforce<\/b>: good hubs point to good authorities; good authorities are pointed to by good hubs. HITS (Kleinberg) is <b>query-dependent<\/b>: it runs on a focused subgraph (root set of search results + pages linking to/from them = base set).<\/p>"}, {"type": "formula", "q": "State the HITS update rules.", "a": "<span class=\"f\">a(p) = Σ<sub>q→p<\/sub> h(q)        a = Aᵀh\nh(p) = Σ<sub>p→q<\/sub> a(q)        h = A a\nthen normalise a and h; repeat until convergence<\/span><p>A = adjacency matrix (A<sub>ij<\/sub> = 1 if i links to j). Converges to the principal eigenvectors of AᵀA (authorities) and AAᵀ (hubs). Normalise by sum, or by √Σx² — follow your notes.<\/p>"}, {"type": "calc", "q": "Graph: 1→2, 1→3, 2→3, 3→1, 4→3. Start h = (1,1,1,1). Compute one HITS iteration (authority then hub), normalising by sum.", "a": "<span class=\"f\">a = Aᵀh:\na(1) = h(3) = 1\na(2) = h(1) = 1\na(3) = h(1)+h(2)+h(4) = 3\na(4) = 0                         → a = (1, 1, 3, 0)\n\nh = A a:\nh(1) = a(2)+a(3) = 4\nh(2) = a(3) = 3\nh(3) = a(1) = 1\nh(4) = a(3) = 3                  → h = (4, 3, 1, 3)\n\nNormalised: a = (0.20, 0.20, 0.60, 0.00)   h = (0.36, 0.27, 0.09, 0.27)\nConverged:  a ≈ (0.00, 0.29, 0.71, 0.00)   h ≈ (0.41, 0.29, 0.00, 0.29)<\/span><p>Page 3 is the top <b>authority<\/b>; page 1 is the top <b>hub<\/b> (it points to both 2 and 3).<\/p>"}, {"type": "theory", "q": "Compare PageRank and HITS.", "a": "<table class=\"t\"><tr><th><\/th><th>PageRank<\/th><th>HITS<\/th><\/tr><tr><td>Scores<\/td><td>one score per page<\/td><td>two: hub + authority<\/td><\/tr><tr><td>Query<\/td><td>independent (offline)<\/td><td>dependent (at query time)<\/td><\/tr><tr><td>Graph<\/td><td>whole web<\/td><td>small focused subgraph<\/td><\/tr><tr><td>Spam<\/td><td>more robust<\/td><td>easier to manipulate (add out-links to become a hub)<\/td><\/tr><tr><td>Problem<\/td><td>—<\/td><td>topic drift<\/td><\/tr><\/table>"}, {"type": "theory", "q": "What are dangling nodes and rank sinks? How are they handled?", "a": "<p><b>Dangling node<\/b>: page with no out-links — its rank would “leak” out of the system. Fix: treat it as linking to every page (uniform distribution).<\/p><p><b>Rank sink<\/b>: a group of pages linking only to each other — would accumulate all rank. Fix: the damping/teleport term (1 − d) lets the random surfer escape.<\/p>"}, {"type": "theory", "q": "Give applications of web usage mining.", "a": "<ul><li>Discover frequent access/navigation patterns (sequential pattern mining on logs)<\/li><li>Personalisation and recommendation<\/li><li>Improve site design and link structure<\/li><li>Caching/prefetching, marketing, user segmentation<\/li><\/ul><p>Requires preprocessing: data cleaning, user and session identification, path completion.<\/p>"}];
const KEY = "is328-fc-11-web-mining";
const LABEL = {theory:"Theory", formula:"Formula", calc:"Calculation", scenario:"Scenario"};
let marks = {};
try { marks = JSON.parse(localStorage.getItem(KEY) || "{}") || {}; } catch(e) { marks = {}; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(marks)); } catch(e){} }

let filter = "all", onlyReview = false, order = CARDS.map((_,i)=>i), deck = [], idx = 0;
const $ = id => document.getElementById(id);

function buildFilters(){
  const counts = {all:CARDS.length};
  CARDS.forEach(c => counts[c.type] = (counts[c.type]||0)+1);
  const f = $("filters"); f.innerHTML = "";
  ["all","theory","formula","calc","scenario"].forEach(t=>{
    if(!counts[t]) return;
    const b = document.createElement("button");
    b.className="chip"; b.type="button";
    b.setAttribute("aria-pressed", t===filter);
    b.innerHTML = (t==="all"?"All cards":LABEL[t]) + '<span class="n">'+counts[t]+'</span>';
    b.onclick = ()=>{ filter=t; buildFilters(); rebuild(); };
    f.appendChild(b);
  });
}
function rebuild(keepCard){
  const cur = deck[idx];
  deck = order.filter(i => (filter==="all"||CARDS[i].type===filter) && (!onlyReview || marks[i]==="r"));
  idx = keepCard!=null && deck.includes(cur) ? deck.indexOf(cur) : 0;
  render(); renderList();
}
function tagHTML(t){ return '<span class="tag t-'+t+'">'+LABEL[t]+'</span>'; }
function statusHTML(i){
  if(marks[i]==="k") return '<span class="status k">✓ Got it</span>';
  if(marks[i]==="r") return '<span class="status r">✗ Review again</span>';
  return "";
}
function render(){
  const card = $("card"); card.classList.remove("flipped");
  const known = Object.values(marks).filter(v=>v==="k").length;
  $("score").textContent = known + " / " + CARDS.length + " marked “got it”";
  $("prog").style.width = (100*known/CARDS.length) + "%";
  if(!deck.length){
    $("front").innerHTML = '<div class="empty">No cards here.<br>'+(onlyReview?"Nothing marked “review again” — nice.":"")+'</div>';
    $("back").innerHTML = ""; $("pos").textContent = "0 / 0"; return;
  }
  const i = deck[idx], c = CARDS[i];
  $("pos").textContent = "Card " + (idx+1) + " / " + deck.length;
  setTimeout(()=>{ // swap content after flip-back starts so the answer never flashes
    $("front").innerHTML = '<div style="display:flex;align-items:center;gap:8px">'+tagHTML(c.type)+statusHTML(i)+'</div><div class="q">'+c.q+'</div><div class="hint">Click card or press Space to reveal</div>';
    $("back").innerHTML = '<div style="display:flex;align-items:center;gap:8px">'+tagHTML(c.type)+statusHTML(i)+'</div><div class="qsmall">'+c.q+'</div><div class="ans">'+c.a+'</div>';
    $("front").scrollTop = 0; $("back").scrollTop = 0;
    card.style.height = "auto";
    const h = Math.max(380, $("front").scrollHeight, $("back").scrollHeight);
    card.style.height = h + "px";
  }, card.dataset.init ? 120 : 0);
  card.dataset.init = 1;
}
function renderList(){
  $("list").innerHTML = deck.map((i,n)=>{
    const c = CARDS[i];
    return '<div class="litem">'+tagHTML(c.type)+' '+statusHTML(i)+'<h3>'+(n+1)+'. '+c.q+'</h3><div class="ans">'+c.a+'</div></div>';
  }).join("") || '<div class="empty">No cards here.</div>';
}
function flip(){ if(deck.length) $("card").classList.toggle("flipped"); }
function move(d){ if(!deck.length) return; idx = (idx + d + deck.length) % deck.length; render(); }
function mark(v){
  if(!deck.length) return;
  const i = deck[idx]; marks[i] = v; save();
  if(onlyReview && v==="k"){ rebuild(); return; }
  move(1); renderList();
}
$("card").onclick = e => { if(!e.target.closest("a")) flip(); };
$("flip").onclick = flip; $("prev").onclick = ()=>move(-1); $("next").onclick = ()=>move(1);
$("markK").onclick = ()=>mark("k"); $("markR").onclick = ()=>mark("r");
$("shuffle").onclick = ()=>{ for(let i=order.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[order[i],order[j]]=[order[j],order[i]];} rebuild(); };
$("onlyReview").onclick = function(){ onlyReview=!onlyReview; this.setAttribute("aria-pressed",onlyReview); rebuild(); };
$("listView").onclick = function(){ const on = this.getAttribute("aria-pressed")!=="true"; this.setAttribute("aria-pressed",on); $("list").classList.toggle("on",on); $("studyArea").style.display = on?"none":""; };
$("reset").onclick = ()=>{ marks={}; save(); rebuild(true); };
$("theme").onclick = ()=>{ const r=document.documentElement; const dark = r.dataset.theme ? r.dataset.theme==="dark" : matchMedia("(prefers-color-scheme: dark)").matches; r.dataset.theme = dark?"light":"dark"; };
document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.key===" "||e.key==="Enter"){ e.preventDefault(); flip(); }
  else if(e.key==="ArrowRight") move(1);
  else if(e.key==="ArrowLeft") move(-1);
  else if(e.key==="1") mark("r");
  else if(e.key==="2") mark("k");
});
buildFilters(); rebuild();
</script>
</body>
</html>
